<!DOCTYPE html><html><head><style>
body{margin:0;display:flex;gap:0}
.tile{width:420px;height:420px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.dark{background:#0d0f1c}.light{background:#f4f6fb}
.tile img{width:220px;height:220px}
.wm{font-family:'Segoe UI',sans-serif;font-weight:700;letter-spacing:.28em;font-size:22px;margin-top:14px}
.dark .wm{color:#fff}.light .wm{color:#0d0f1c}
</style></head><body>
<div class="tile dark"><img src="images/tokaa-mark.svg"><div class="wm">TOKAA</div></div>
<div class="tile light"><img src="images/tokaa-mark.svg"><div class="wm">TOKAA</div></div>
</body></html>
